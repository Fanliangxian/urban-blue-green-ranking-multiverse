    centroid_definition: polygon_true_centroid_after_projection
    centroid_projection: Asia_North_Albers_Equal_Area_Conic_ESRI_102025
    distance_definition: WGS84_great_circle_haversine_between_projected_polygon_centroids
    geometry_repair: prohibited_without_protocol_amendment
  residual_models:
    outcomes:
      - total_rank_instability_rms_z
      - boundary_rank_sensitivity_rms_z
      - product_rank_sensitivity_rms_z
      - interaction_rank_sensitivity_rms_z
    formula_and_sample: identical_to_task6_and_task6d_full_models
  moran_i:
    primary_weights: symmetrized_binary_4_nearest_neighbors_row_standardized
    sensitivity_weights:
      - symmetrized_binary_8_nearest_neighbors_row_standardized
      - binary_500_km_distance_band_row_standardized
    permutation_replicates: 9999
    random_seed: 20260820
    p_value: two_sided_plus_one_relative_to_randomization_expectation
    primary_outcome_test: single_prespecified_test
    component_family:
      size: 3
      correction: benjamini_hochberg_FDR_within_each_weight_scheme
  conley_spatial_hac:
    estimator: OLS_coefficients_unchanged
    distance_kernel: bartlett
    primary_cutoff_km: 500
    sensitivity_cutoffs_km: [250, 1000]
    covariance_small_sample_correction: n_divided_by_n_minus_p
    tests: two_sided_normal_reference
    primary_five_domain_joint_test: robust_wald_chi_square
    component_multiplicity:
      family: five_primary_domains_x_three_components_within_each_cutoff
      size: 15
      correction: benjamini_hochberg_FDR
  decision_rules:
    - report_spatial_dependence_whether_significant_or_not
    - compare_HC3_and_Conley_interval_exclusion_of_zero_without_replacing_main_coefficients
    - report_all_three_Conley_cutoffs_and_all_three_Moran_weight_schemes
