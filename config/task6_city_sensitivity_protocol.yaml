task6e_robustness_execution:
  status: frozen_before_robustness_model_fit
  frozen_on: "2026-08-20"
  role: prespecified_robustness_not_replacement_confirmatory_analysis
  sample_n: 284
  common_model:
    estimator: ordinary_least_squares
    predictors_and_region_fixed_effects: identical_to_confirmatory_full_model
    uncertainty: HC3_robust_95_percent_confidence_intervals
    continuous_predictor_standardization: retain_frozen_full_sample_columns
    tests: two_sided
  rank_transformed_primary_outcome:
    source: total_rank_instability_rms
    tie_method: average_rank
    transform: rank_minus_1_divided_by_n_minus_1_then_z_standardize
    multiplicity_family: five_primary_domains
    family_size: 5
    correction: benjamini_hochberg_FDR
  alternative_outcomes:
    outcomes:
      - normalized_percentile_range_z
      - normalized_percentile_iqr_z
      - quartile_membership_entropy_bits_z
    multiplicity_family: five_primary_domains_x_three_alternative_outcomes
    family_size: 15
    correction: benjamini_hochberg_FDR
  component_influence_sensitivity:
    components:
      - boundary_rank_sensitivity_rms_z
      - product_rank_sensitivity_rms_z
      - interaction_rank_sensitivity_rms_z
    primary_component_fits: retain_all_284_cities
    sensitivity_exclusion_union:
      - leverage_gt_3p_over_n
      - cooks_distance_gt_4_over_n
      - absolute_external_studentized_residual_gt_3
    exclusions: outcome_specific
    multiplicity_family: five_primary_domains_x_three_component_sensitivity_refits
    family_size: 15
    correction: benjamini_hochberg_FDR
  component_leave_one_macroregion_out:
    folds: seven_per_component
    region_fixed_effects: retained_for_regions_present_in_training_data
    comparison_terms: seven_continuous_predictors
    per_fold_significance_or_multiplicity_testing: prohibited
    interpretation: coefficient_direction_stability_only

