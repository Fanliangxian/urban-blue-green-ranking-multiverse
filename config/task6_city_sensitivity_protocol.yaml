task6f_spatial_dependence_execution:
  status: frozen_confirmed_before_spatial_results
  confirmed_on: "2026-08-20"
  role: residual_spatial_dependence_audit_and_spatially_robust_inference
  claim_type: associational_robustness
  causal_spatial_lag_interpretation: prohibited
  sample_n: 284
  geometry:
    source: data/derived/task6_reference_admin2021/task6_reference_admin2021.shp
