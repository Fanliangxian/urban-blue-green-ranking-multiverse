protocol:
  task: 6
  protocol_id: city_sensitivity_associations_r1
  version: "0.1"
  drafted_on: "2026-08-11"
  status: frozen_confirmed
  confirmed_on: "2026-08-11"
  claim_type: associational
  causal_language_prohibited: true

analysis_population:
  primary: common_285_cities_in_all_8_confirmatory_map_specifications
  frozen_complete_case_n: 284
  frozen_complete_case_exclusion:
    - city_id: CN-630200
      city_name: 海东市
      reason: no_retained_worldpop_center_so_periurban_ring_and_farm_fraction_are_undefined
  sensitivity:
    - all_cities_with_available_task5_city_instability_metrics
    - legacy_291_members_with_complete_covariates
  unit_of_analysis: city
  macroregion_definition:
    id: china_seven_geographic_regions_r1
    source: data/reference/china_seven_macroregions.csv
    regions:
      - east_china
      - north_china
      - northeast_china
      - central_china
      - south_china
      - southwest_china
      - northwest_china
    fixed_effect_reference: east_china
    cross_validation_folds: leave_one_macroregion_out_seven_folds
  missing_covariates:
    primary_rule: complete_case_only_after_missingness_audit
    imputation: not_allowed_without_protocol_amendment
    report_flow: registered_296_to_task5_common285_to_complete_covariate_sample

outcomes:
  primary:
    id: total_rank_instability_rms
    source: data/derived/R1_task5_city_factorial_sensitivity_decomposition.csv
    source_filter:
      scale: common285_normalized_rank_percentile
      outcome_id: blue_green_share
    formula: sqrt(ss_total_within_city / 8)
    unit: normalized_rank_percentile
    interpretation: root_mean_square_deviation_across_the_frozen_8_map_set
  component_specific:
    - id: boundary_rank_sensitivity_rms
      formula: sqrt(ss_boundary / 8)
    - id: product_rank_sensitivity_rms
      formula: sqrt(ss_product / 8)
    - id: interaction_rank_sensitivity_rms
      formula: sqrt(ss_boundary_product_interaction / 8)
  sensitivity:
    - normalized_percentile_range
    - normalized_percentile_iqr
    - quartile_membership_entropy_bits
  prohibited_primary_outcome:
    - variance_share_alone
  rationale: component_shares_are_unstable_when_total_instability_is_near_zero

candidate_explanatory_domains:
  confirmatory:
    - id: city_population_2020
      construct: city_size
      preferred_source: official_2020_population_census_prefecture_city_table
      transform: log1p
      expected_direction: unspecified_control
    - id: independent_city_area_km2
      construct: spatial_extent
      preferred_source: independent_registered_administrative_geometry
      transform: log
      expected_direction: unspecified_control
    - id: polycentricity_index
      construct: settlement_structure
      preferred_source: independent_2020_built_up_or_population_surface
      expected_direction_for_boundary_sensitivity: positive
    - id: boundary_shape_complexity
      construct: urban_form_complexity
      preferred_source: independent_frozen_reference_geometry
      expected_direction_for_boundary_sensitivity: positive
    - id: periurban_farm_fraction
      construct: urban_rural_gradient
      preferred_source: independent_land_cover_product_not_used_in_task5_outcomes
      expected_direction_for_boundary_sensitivity: positive
    - id: surface_water_density
      construct: hydrographic_context
      preferred_source: jrc_global_surface_water_or_equivalent_independent_water_record
      expected_direction_for_blue_and_total_sensitivity: positive
    - id: terrain_ruggedness
      construct: topographic_context
      preferred_source: merit_dem_or_copernicus_dem
      expected_direction_for_boundary_sensitivity: positive
  diagnostic_not_confirmatory:
    - number_of_gctb_components
    - cross_boundary_area_range
    - task5_landcover_class_share
  diagnostic_reason: mechanically_or_lineage_coupled_to_boundary_or_landcover_outcomes

operationalization_rules:
  temporal_target: 2020_to_2021
  acceptable_temporal_window: 2018_to_2022_with_explicit_justification
  spatial_support: independent_registered_city_reference_geometry
  no_outcome_derived_cutpoints: true
  no_stepwise_variable_selection: true
  no_univariate_p_value_screening: true
  all_units_and_transformations_frozen_before_model_fit: true
  source_lineage_and_license_required: true

hypothesis:
  id: H3
  status: candidate
  statement: polycentricity_boundary_complexity_periurban_farm_water_density_and_ruggedness_are_associated_with_greater_map_sensitivity_beyond_city_population_and_area
  rival_explanations:
    - shared_input_or_direct_measurement_coupling
    - regional_confounding
    - city_selection_and_covariate_missingness
    - spatial_autocorrelation
    - sensitivity_metric_scale_artifact
  falsification_or_non_support:
    - directions_reverse_or_are_highly_unstable_across_prespecified_models
    - associations_disappear_in_spatial_block_validation
    - independent_covariates_add_negligible_predictive_information_beyond_population_area_and_region

models:
  descriptive:
    - pairwise_spearman_with_bootstrap_ci
    - raw_scatter_and_partial_residual_diagnostics
  confirmatory_associational:
    formula: outcome_z ~ log_population_z + log_area_z + polycentricity_z + shape_complexity_z + periurban_farm_z + water_density_z + ruggedness_z + macroregion_fixed_effects
    estimator: ordinary_least_squares
    uncertainty: HC3_robust_95_percent_confidence_intervals
    report: standardized_coefficients_confidence_intervals_partial_R2_and_model_adjusted_R2
  robustness:
    - rank_based_outcome_model
    - leave_one_macroregion_out_refits
    - spatial_block_cross_validation_by_macroregion
    - variance_inflation_factor_and_condition_number
    - influence_diagnostics_without_automatic_deletion
    - component_specific_outcomes_with_FDR_correction
  prohibited:
    - causal_effect_language
    - automated_stepwise_selection
    - deleting_influential_cities_only_to_improve_significance
    - treating_province_or_region_replicates_as_independent_when_resampling

multiplicity:
  single_primary_outcome: total_rank_instability_rms
  primary_predictor_family: five_non_control_explanatory_domains
  correction_for_component_specific_family: benjamini_hochberg_FDR
  exploratory_results: label_explicitly

validation:
  preprocessing_fit_within_training_folds: true
  block_definition: macroregion
  performance_metrics:
    - cross_validated_R2
    - mean_absolute_error
  baseline_model: population_area_and_macroregion_only
  target_comparison: incremental_out_of_block_predictive_value

gate_6a:
  status: passed
  protocol_confirmation: passed
  confirmed_by: accountable_human_research_lead
  confirmed_on: "2026-08-11"
  passed_on: "2026-08-19"
  national_covariate_table: data/derived/R1_task6_covariates_296.csv
  national_audit: data/derived/R1_task6_national_covariates_296_audit.json
  registered_city_count: 296
  primary_complete_case_count: 284
  pass_requirements:
    - accountable_human_confirms_task6_protocol
    - covariate_registry_has_frozen_definition_year_source_lineage_license_and_unit
    - independent_reference_geometry_is_frozen
    - city_coverage_and_missingness_are_audited
    - no_confirmatory_model_has_been_fit_before_covariate_freeze

gate_6b:
  status: passed
  passed_on: "2026-08-20"
  model_frame: data/derived/R1_task6_model_frame_284.csv
  premodel_audit: data/derived/R1_task6_premodel_diagnostics.json
  complete_case_n: 284
  model_fit_performed_during_gate: false
  coefficient_or_significance_screening_performed: false
  diagnostics:
    maximum_vif: 2.7941119477527443
    standardized_design_condition_index: 3.5315153256839764
    predictor_pair_absolute_spearman_ge_0_8_count: 0
    high_leverage_city_count_2p_over_n: 12
    severe_leverage_city_count_3p_over_n: 2
  formal_model_requirements:
    - retain_all_valid_cities_in_primary_fit
    - report_HC3_robust_intervals
    - report_influence_diagnostics_without_automatic_deletion
    - include_prespecified_sensitivity_excluding_severe_influence_cases
    - fit_preprocessing_within_training_fold_for_cross_validation

confirmatory_model_execution:
  frozen_on: "2026-08-20"
  sample_n: 284
  alpha: 0.05
  tests: two_sided
  primary_inference:
    estimator: ordinary_least_squares
    outcome: total_rank_instability_rms_z
    continuous_terms:
      - log_population_z
      - log_area_z
      - polycentricity_z
      - shape_complexity_z
      - periurban_farm_z
      - water_density_z
      - ruggedness_z
    region_fixed_effects: six_indicators_with_east_china_reference
    uncertainty: HC3_robust_95_percent_confidence_intervals
    partial_R2: classical_SSE_reduction_from_dropping_each_term_or_prespecified_block
  influence_thresholds:
    high_leverage: 2p_over_n
    severe_leverage: 3p_over_n
    cooks_distance: 4_over_n
    absolute_external_studentized_residual: 3
    absolute_dffits: 2_sqrt_p_over_n
    absolute_dfbeta: 2_over_sqrt_n
    primary_fit_deletion: prohibited
    sensitivity_exclusion_union:
      - leverage_gt_3p_over_n
      - cooks_distance_gt_4_over_n
      - absolute_external_studentized_residual_gt_3
  leave_one_macroregion_out_refits:
    region_fixed_effects: retained_for_regions_present_in_training_data
    comparison_terms: seven_continuous_predictors
  spatial_block_cross_validation:
    folds: seven_leave_one_macroregion_out
    outcome_scale: raw_total_rank_instability_rms
    preprocessing: fit_on_training_fold_only
    region_fixed_effects: omitted_because_held_out_region_level_is_unestimable
    baseline_predictors:
      - log_population
      - log_area
    full_predictors:
      - log_population
      - log_area
      - polycentricity_index
      - boundary_shape_complexity
      - periurban_farm_fraction
      - surface_water_density
      - terrain_ruggedness_riley_mean_m
    performance:
      - pooled_cross_validated_R2
      - mean_absolute_error
    target: full_minus_baseline_incremental_out_of_region_prediction

